name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Copy sounds, notification icon and permissions
        run: npm run setup-android

      - name: Generate app icons
        run: |
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Show target SDK
        run: grep -rn "targetSdkVersion\|compileSdkVersion\|minSdkVersion" android/variables.gradle

      - name: Build debug APK and release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: miqat-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish build outputs to a branch
        run: |
          mkdir -p /tmp/out
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/out/
          cd /tmp/out
          git init -q
          git checkout -q -b builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "build outputs"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
